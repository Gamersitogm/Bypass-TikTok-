<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Procesador de Video</title>

<style>
*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:system-ui,Arial,sans-serif;
    color:white;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;

    position:relative;
    overflow:hidden;

    background:
        radial-gradient(circle at 20% 20%, #1d4ed8 0%, transparent 35%),
        radial-gradient(circle at 80% 30%, #06b6d4 0%, transparent 35%),
        radial-gradient(circle at 50% 80%, #9333ea 0%, transparent 40%),
        #050816;
}

body::before{
    content:"";
    position:fixed;
    inset:-50%;
    background: radial-gradient(circle, rgba(255,255,255,.06) 0%, transparent 60%);
    animation:move 18s linear infinite;
    pointer-events:none;
    will-change: transform;
}

@keyframes move{
    0%{transform:rotate(0deg);}
    100%{transform:rotate(360deg);}
}

/* PANEL */
.app{
    position:relative;

    width:92%;
    max-width:420px;

    background:rgba(255,255,255,0.07);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);

    border:1px solid rgba(255,255,255,0.15);
    border-radius:24px;

    padding:22px;
    text-align:center;

    box-shadow:
        0 20px 60px rgba(0,0,0,0.5),
        inset 0 1px 0 rgba(255,255,255,0.2);

    animation:fadeIn .6s ease;
}

@keyframes fadeIn{
    from{opacity:0; transform:translateY(25px) scale(.98);}
    to{opacity:1; transform:translateY(0) scale(1);}
}

/* AUDIO BTN */
.audio-btn{
    position:absolute;
    top:12px;
    right:12px;

    width:42px;
    height:42px;
    border-radius:12px;

    border:1px solid rgba(255,255,255,0.2);
    background:rgba(255,255,255,0.08);
    backdrop-filter: blur(12px);

    color:white;
    font-size:18px;
    cursor:pointer;

    display:flex;
    align-items:center;
    justify-content:center;

    transition:.2s;
}

.audio-btn:hover{
    transform:scale(1.1);
    background:rgba(255,255,255,0.15);
}

/* LOGO */
#logo{
    width:96px;
    height:96px;
    border-radius:22px;
    object-fit:cover;
    margin-bottom:10px;
    cursor:pointer;

    box-shadow:
        0 10px 30px rgba(0,0,0,.4),
        0 0 25px rgba(0,255,255,.25);
}

h2{
    margin:8px 0 16px;
}

input[type=file]{display:none;}

.file-label{
    display:block;
    padding:14px;
    border-radius:14px;
    margin-top:12px;
    cursor:pointer;
    font-weight:600;

    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.15);
    backdrop-filter: blur(12px);

    transition:.25s;
}

.file-label:hover{
    transform:translateY(-2px);
    background:rgba(255,255,255,0.12);
}

button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:14px;
    margin-top:10px;
    cursor:pointer;
    font-weight:700;
    color:white;

    background: linear-gradient(135deg, #06b6d4, #2563eb);
    transition:.2s;
}

button:hover{
    transform:translateY(-2px) scale(1.02);
}

button:active{
    transform:scale(.97);
}

.status-box{
    margin-top:14px;
    padding:12px;
    border-radius:14px;

    background:rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.1);

    backdrop-filter: blur(10px);
    font-size:14px;
}

.ok{color:#4ade80;}
.error{color:#f87171;}

.toast{
    position:fixed;
    left:50%;
    bottom:25px;
    transform:translateX(-50%);

    padding:12px 18px;
    border-radius:14px;

    background:rgba(0,0,0,0.4);
    border:1px solid rgba(255,255,255,0.15);
    backdrop-filter: blur(14px);

    opacity:0;
    transition:.3s;
}

.toast.show{opacity:1;}

/* 🍮 JELLY ANIMATION */
@keyframes jelly {
    0%   { transform: scale(1,1) rotate(0deg); }
    15%  { transform: scale(1.25,0.75) rotate(-2deg); }
    30%  { transform: scale(0.75,1.25) rotate(2deg); }
    45%  { transform: scale(1.15,0.85) rotate(-1deg); }
    60%  { transform: scale(0.95,1.05) rotate(1deg); }
    75%  { transform: scale(1.05,0.95) rotate(0deg); }
    100% { transform: scale(1,1) rotate(0deg); }
}

.jelly{
    animation: jelly 0.8s ease;
}
</style>
</head>

<body>

<div class="app">

<button id="audioBtn" class="audio-btn">🔊</button>

<img id="logo"
src="https://raw.githubusercontent.com/Gamersitogm/bypass23/refs/heads/main/capybara.png">

<h2>Procesador de Video</h2>

<label class="file-label">
📁 Seleccionar MP4
<input type="file" id="file" accept="video/mp4">
</label>

<div id="status" class="status-box">
No hay archivo seleccionado
</div>

<button id="remove">Eliminar</button>
<button id="run">Procesar</button>

</div>

<div id="toast" class="toast"></div>

<!-- 🎧 AMBIENT -->
<audio id="ambient" src="https://mp3tourl.com/audio/1781393301050-35d21512-24e6-481a-8b44-fa210a186863.mp3" loop></audio>

<!-- 🔊 CLICK -->
<audio id="clickSound"
src="https://www.image2url.com/r2/default/audio/1779156589501-a9f6b9cb-03f2-4399-9c84-dcc69fe834f6.mp3"
preload="auto"></audio>

<script>
const fileInput = document.getElementById("file");
const statusBox = document.getElementById("status");
const clickSound = document.getElementById("clickSound");
const ambient = document.getElementById("ambient");
const audioBtn = document.getElementById("audioBtn");
const logo = document.getElementById("logo");

let currentFile = null;
let isPlaying = false;

/* 🔊 UNLOCK AUDIO GLOBAL (click inicial) */
function unlockAudio(){
    ambient.volume = 0.4;
    ambient.play().catch(()=>{});
    isPlaying = true;
    audioBtn.textContent = "🔊";
}

document.addEventListener("pointerdown", unlockAudio, { once:true });

/* 🔊 BOTÓN AUDIO */
audioBtn.addEventListener("click", async () => {
    try {
        if (!isPlaying) {
            ambient.volume = 0.4;
            await ambient.play();
            audioBtn.textContent = "🔊";
            isPlaying = true;
        } else {
            ambient.pause();
            audioBtn.textContent = "🔇";
            isPlaying = false;
        }
    } catch (e) {
        console.log("Audio error:", e);
    }
});

/* 🔊 CLICK SOUND */
function playClick(){
    clickSound.currentTime = 0;
    clickSound.play().catch(()=>{});
}

/* 🍮 JELLY */
function triggerJelly(el){
    el.classList.remove("jelly");
    void el.offsetWidth;
    el.classList.add("jelly");
}

/* botones + click sound + jelly */
document.querySelectorAll("button,.file-label,#audioBtn")
.forEach(el=>{
    el.addEventListener("click", ()=>{
        playClick();
        triggerJelly(el);
    });
});

/* logo */
logo.addEventListener("click", () => {
    playClick();
    triggerJelly(logo);
});

/* toast */
function toast(msg){
    const t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    setTimeout(()=> t.classList.remove("show"), 2500);
}

/* file */
fileInput.addEventListener("change", ()=>{
    currentFile = fileInput.files[0];

    if(currentFile){
        statusBox.textContent = "Archivo: " + currentFile.name;
        statusBox.className = "status-box ok";
        toast("Archivo cargado");
    }
});

/* remove */
document.getElementById("remove").onclick = ()=>{
    fileInput.value = "";
    currentFile = null;
    statusBox.textContent = "No hay archivo seleccionado";
    statusBox.className = "status-box";
    toast("Archivo eliminado");
};

/* process */
document.getElementById("run").onclick = async ()=>{

    if(!currentFile){
        toast("Selecciona un archivo");
        return;
    }

    try{

        statusBox.textContent = "Subiendo archivo...";
        statusBox.className = "status-box ok";

        const formData = new FormData();
        formData.append("file", currentFile);

        const upload = await fetch("https://api.kuronaiapp.com/upload/", {
            method: "POST",
            body: formData
        });

        const data = await upload.json();

        if(!data.file_id){
            throw new Error("No file_id");
        }

        statusBox.textContent = "Procesando...";

        let response;

        for(let i=0;i<20;i++){
            response = await fetch("https://api.kuronaiapp.com/download/" + data.file_id);
            if(response.ok) break;
            await new Promise(r=>setTimeout(r,1500));
        }

        if(!response || !response.ok){
            throw new Error("No listo");
        }

        const blob = await response.blob();
        const url = URL.createObjectURL(blob);

        const a = document.createElement("a");
        a.href = url;
        a.download = "video.mp4";
        document.body.appendChild(a);
        a.click();
        a.remove();

        URL.revokeObjectURL(url);

        statusBox.textContent = "Proceso completado";
        toast("Descarga iniciada");

    }catch(err){
        statusBox.textContent = "Error en proceso";
        statusBox.className = "status-box error";
        toast("Error");
    }
};
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Procesador de Video</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:system-ui,Arial,sans-serif;
    color:white;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;

    position:relative;
    overflow:hidden;

    background:
        radial-gradient(circle at 20% 20%, #1d4ed8 0%, transparent 35%),
        radial-gradient(circle at 80% 30%, #06b6d4 0%, transparent 35%),
        radial-gradient(circle at 50% 80%, #9333ea 0%, transparent 40%),
        #050816;
}

body::before{
    content:"";
    position:fixed;
    inset:-50%;
    background: radial-gradient(circle, rgba(255,255,255,.06) 0%, transparent 60%);
    animation:move 18s linear infinite;
    pointer-events:none;
    will-change: transform;
}

@keyframes move{
    0%{transform:rotate(0deg);}
    100%{transform:rotate(360deg);}
}

/* PANEL */
.app{
    position:relative;
    width:92%;
    max-width:420px;

    background:rgba(255,255,255,0.07);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);

    border:1px solid rgba(255,255,255,0.15);
    border-radius:24px;

    padding:22px;
    text-align:center;

    box-shadow:
        0 20px 60px rgba(0,0,0,0.5),
        inset 0 1px 0 rgba(255,255,255,0.2);

    animation:fadeIn .6s ease;
}

@keyframes fadeIn{
    from{opacity:0; transform:translateY(25px) scale(.98);}
    to{opacity:1; transform:translateY(0) scale(1);}
}

/* AUDIO BTN */
.audio-btn{
    position:absolute;
    top:12px;
    right:12px;

    width:42px;
    height:42px;
    border-radius:12px;

    border:1px solid rgba(255,255,255,0.2);
    background:rgba(255,255,255,0.08);
    backdrop-filter: blur(12px);

    color:white;
    font-size:18px;
    cursor:pointer;

    display:flex;
    align-items:center;
    justify-content:center;

    transition:.2s;
}

.audio-btn:hover{
    transform:scale(1.1);
    background:rgba(255,255,255,0.15);
}

/* LOGO */
#logo{
    width:96px;
    height:96px;
    border-radius:22px;
    object-fit:cover;
    margin-bottom:10px;
    cursor:pointer;

    box-shadow:
        0 10px 30px rgba(0,0,0,.4),
        0 0 25px rgba(0,255,255,.25);
}

h2{
    margin:8px 0 16px;
}

input[type=file]{display:none;}

.file-label{
    display:block;
    padding:14px;
    border-radius:14px;
    margin-top:12px;
    cursor:pointer;
    font-weight:600;

    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.15);
    backdrop-filter: blur(12px);

    transition:.25s;
}

.file-label:hover{
    transform:translateY(-2px);
    background:rgba(255,255,255,0.12);
}

button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:14px;
    margin-top:10px;
    cursor:pointer;
    font-weight:700;
    color:white;

    background: linear-gradient(135deg, #06b6d4, #2563eb);
    transition:.2s;
}

button:hover{
    transform:translateY(-2px) scale(1.02);
}

button:active{
    transform:scale(.97);
}

.status-box{
    margin-top:14px;
    padding:12px;
    border-radius:14px;

    background:rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.1);

    backdrop-filter: blur(10px);
    font-size:14px;
}

.ok{color:#4ade80;}
.error{color:#f87171;}

/* PROGRESO */
.progress-wrap{
    margin-top:12px;
    height:0;
    overflow:hidden;
    transition: height .3s ease;
}

.progress-wrap.show{
    height:40px;
}

.progress-bg{
    width:100%;
    height:12px;
    border-radius:999px;
    background:rgba(255,255,255,0.1);
    border:1px solid rgba(255,255,255,0.15);
    overflow:hidden;
}

.progress-fill{
    height:100%;
    width:0%;
    background:linear-gradient(90deg,#06b6d4,#2563eb);
    transition:width .15s;
}

.progress-text{
    font-size:12px;
    margin-top:6px;
    opacity:.85;
}

/* JELLY */
@keyframes jelly {
    0%   { transform: scale(1,1) rotate(0deg); }
    15%  { transform: scale(1.25,0.75) rotate(-2deg); }
    30%  { transform: scale(0.75,1.25) rotate(2deg); }
    45%  { transform: scale(1.15,0.85) rotate(-1deg); }
    60%  { transform: scale(0.95,1.05) rotate(1deg); }
    75%  { transform: scale(1.05,0.95) rotate(0deg); }
    100% { transform: scale(1,1) rotate(0deg); }
}

.jelly{
    animation: jelly 0.8s ease;
}

.modal{
    position:fixed;
    inset:0;
    display:none;
    justify-content:center;
    align-items:center;
    background:rgba(0,0,0,0.4);
    backdrop-filter: blur(10px);
    z-index:99999;
}

.modal.show{
    display:flex;
}

.modal-box{
    background:rgba(255,255,255,0.1);
    border:1px solid rgba(255,255,255,0.2);
    padding:20px;
    border-radius:20px;
    text-align:center;
    color:white;
}

@keyframes jelly {
    0%{transform:scale(1);}
    30%{transform:scale(1.2,0.8);}
    60%{transform:scale(0.9,1.1);}
    100%{transform:scale(1);}
}

.jelly{
    animation:jelly .4s ease;
}
</style>
</head>



<body>

<div id="modal" class="modal">
  <div class="modal-box" id="modalBox">
    <h3>¿Cancelar subida?</h3>
    <p>Se detendrá el proceso.</p>

    <button id="modalNo">No</button>
    <button id="modalYes">Sí</button>
  </div>
</div>

<div class="app">

<button id="audioBtn" class="audio-btn">🔊</button>

<img id="logo"
src="https://raw.githubusercontent.com/Gamersitogm/bypass23/refs/heads/main/capybara.png">

<h2>Procesador de Video</h2>

<label class="file-label">
📁 Seleccionar MP4
<input type="file" id="file" accept="video/mp4">
</label>

<div id="status" class="status-box">No hay archivo seleccionado</div>

<div class="progress-wrap">
    <div class="progress-bg">
        <div id="progressFill" class="progress-fill"></div>
    </div>
    <div id="progressText" class="progress-text">0 MB / 0 MB</div>
</div>

<button id="remove">Eliminar</button>
<button id="run">Subir y Procesar</button>

</div>

<audio id="ambient" src="https://mp3tourl.com/audio/1781393301050-35d21512-24e6-481a-8b44-fa210a186863.mp3" loop></audio>
<audio id="clickSound" src="https://www.image2url.com/r2/default/audio/1779156589501-a9f6b9cb-03f2-4399-9c84-dcc69fe834f6.mp3"></audio>

<script>

const modal = document.getElementById("modal");
const modalBox = document.getElementById("modalBox");
const modalYes = document.getElementById("modalYes");
const modalNo = document.getElementById("modalNo");

let uploading = false;
let xhrUpload = null;

const fileInput = document.getElementById("file");
const statusBox = document.getElementById("status");
const progressFill = document.getElementById("progressFill");
const progressText = document.getElementById("progressText");
const clickSound = document.getElementById("clickSound");
const ambient = document.getElementById("ambient");
const audioBtn = document.getElementById("audioBtn");
const logo = document.getElementById("logo");

logo.addEventListener("click", ()=>{
    setTimeout(()=>{
        window.open("https://www.tiktok.com/@capybarita_23", "_blank");
    }, 3000);
});

let currentFile = null;
let isPlaying = false;

/* AUDIO */
document.addEventListener("pointerdown", ()=>{
    ambient.volume = 0.4;
    ambient.play().catch(()=>{});
},{once:true});

audioBtn.onclick = async ()=>{
    if(isPlaying){
        ambient.pause();
        isPlaying=false;
        audioBtn.textContent="🔇";
    }else{
        await ambient.play();
        isPlaying=true;
        audioBtn.textContent="🔊";
    }
};

/* CLICK + JELLY FIX REAL */

function openModal(){
    modal.classList.add("show");
    modalBox.classList.remove("jelly");
    void modalBox.offsetWidth;
    modalBox.classList.add("jelly");
}

function closeModal(){
    modal.classList.remove("show");
}

function playClick(){
    clickSound.currentTime = 0;
    clickSound.play().catch(()=>{});
}

function jelly(el){
    el.classList.remove("jelly");
    void el.offsetWidth;
    el.classList.add("jelly");
}

function bindEffects(){
    document.querySelectorAll(".app button,.file-label,#audioBtn,#logo")
    .forEach(el=>{
        el.addEventListener("click", ()=>{
            playClick();
            jelly(el);
        });
    });
}

window.addEventListener("DOMContentLoaded", bindEffects);


/* FILE */
fileInput.addEventListener("change", ()=>{
    currentFile = fileInput.files[0];

    if(!currentFile) return;

    const mb = (currentFile.size/1024/1024).toFixed(2);

    statusBox.textContent = `Archivo: ${currentFile.name} (${mb} MB)`;
    
    document.querySelector(".progress-wrap").classList.add("show");
    
    progressText.textContent = `0 MB / ${mb} MB`;
});

/* REMOVE */
const removeBtn = document.getElementById("remove");

removeBtn.onclick = () => {

    if (uploading) {
        openModal();

        modalNo.onclick = closeModal;

        modalYes.onclick = () => {
            closeModal();

            if (xhrUpload) xhrUpload.abort();

            uploading = false;

            statusBox.textContent = "Subida cancelada";
            progressFill.style.width = "0%";
            progressText.textContent = "0 MB / 0 MB";

            removeBtn.textContent = "Eliminar";
        };

        return;
    }

    // RESET normal (ELIMINAR)
    fileInput.value = "";
    currentFile = null;
    
    document.querySelector(".progress-wrap").classList.remove("show");
progressFill.style.width = "0%";

    statusBox.textContent = "No hay archivo seleccionado";
    progressText.textContent = "0 MB / 0 MB";
};

/* UPLOAD PROGRESS */
function upload(file){

    return new Promise((res,rej)=>{

        uploading = true;

        const xhr = new XMLHttpRequest();
        xhrUpload = xhr;

        const form = new FormData();
        form.append("file",file);

        xhr.open("POST","https://api.kuronaiapp.com/upload/");

        xhr.upload.onprogress = (e)=>{
            if(e.lengthComputable){

                const p = (e.loaded/e.total)*100;

                progressFill.style.width = p+"%";

                progressText.textContent =
                `${(e.loaded/1024/1024).toFixed(2)} MB / ${(e.total/1024/1024).toFixed(2)} MB`;
            }
        };

        xhr.onload=()=>{
            uploading = false;
            removeBtn.textContent = "Eliminar";

            res(JSON.parse(xhr.responseText));
        };

        xhr.onerror=()=>{
            uploading = false;
            rej();
        };

        xhr.onabort=()=>{
            uploading = false;
            rej("cancelled");
        };

        xhr.send(form);
    });
}

   
/* RUN */

document.getElementById("run").onclick = async () => {
    if (uploading) return;
    if (!currentFile) {
        statusBox.textContent = "Selecciona archivo";
        return;
    }

    uploading = true;

    const runBtn = document.getElementById("run");
    runBtn.disabled = true;
    removeBtn.textContent = "Cancelar";

    try {
        statusBox.textContent = "Subiendo...";

        const data = await upload(currentFile);

        let r;
        let ok = false;

        for (let i = 0; i < 30; i++) {
            r = await fetch("https://api.kuronaiapp.com/download/" + data.file_id);

            if (r.ok) {
                ok = true;
                break;
            }

            await new Promise(x => setTimeout(x, 1500));
        }

        if (!ok) throw new Error("No listo");

        const blob = await r.blob();
        const url = URL.createObjectURL(blob);

        const a = document.createElement("a");
        a.href = url;
        a.download = "etiquetame: @capybarita_23.mp4";
        a.click();

        URL.revokeObjectURL(url);

        statusBox.textContent = "Listo";

    } catch (e) {
        statusBox.textContent = "Error en proceso";
    }

    uploading = false;
    runBtn.disabled = false;
    removeBtn.textContent = "Eliminar";
};

    
</script>
</body>
</html>
